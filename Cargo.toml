[package]
name = "lightbws"
version = "0.2.7"
edition = "2024"
rust-version = "1.94"
license-file = "LICENSE"
description = "A persistent self-hosted Bitwarden Secrets Manager server"
repository = "https://github.com/ca-x/lightbws"
build = "build.rs"

[dependencies]
aes-gcm = "0.10.3"
aes = "0.8.4"
anyhow = "1.0.104"
argon2 = { version = "0.5.3", features = ["std"] }
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["form", "json", "macros"] }
base64 = "0.22.1"
cbc = { version = "0.1.2", features = ["alloc"] }
cookie = "0.18.2"
hex = "0.4.3"
hmac = "0.12.1"
mime_guess = "2.0.5"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rust-embed = "8.13.0"
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-sqlite", "with-time"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing", "serde", "serde-well-known"] }
tokio = { version = "1.54.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6.11", features = ["catch-panic", "compression-gzip", "limit", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
