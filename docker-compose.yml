name: lightbws

services:
  lightbws:
    image: ${LIGHTBWS_IMAGE:-ghcr.io/ca-x/lightbws:latest}
    restart: unless-stopped
    init: true
    ports:
      - "${LIGHTBWS_LISTEN_ADDRESS:-127.0.0.1}:${LIGHTBWS_PORT:-8080}:8080"
    environment:
      LIGHTBWS_ADMIN_USERNAME: "${LIGHTBWS_ADMIN_USERNAME:-admin}"
      LIGHTBWS_ADMIN_PASSWORD: "${LIGHTBWS_ADMIN_PASSWORD:?Set LIGHTBWS_ADMIN_PASSWORD in .env}"
      LIGHTBWS_COOKIE_SECURE: "${LIGHTBWS_COOKIE_SECURE:-false}"
      LIGHTBWS_ENABLE_UPSTREAM_COMPATIBILITY_ACCOUNT: "${LIGHTBWS_ENABLE_UPSTREAM_COMPATIBILITY_ACCOUNT:-false}"
      LIGHTBWS_MASTER_KEY: "${LIGHTBWS_MASTER_KEY:-}"
      RUST_LOG: "${RUST_LOG:-lightbws=info,tower_http=info}"
    volumes:
      - lightbws-data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  lightbws-data:
